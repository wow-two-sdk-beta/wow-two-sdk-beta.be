name: publish

# Beta-forever: every push to main creates a local version-bump commit and tag,
# tests and verifies its packages, publishes to nuget.org, then pushes that commit and tag.
#
# Every `run:` step below executes from the code dir — `defaults.run.working-directory:
# engineering/codebase/wow-two-sdk-beta-be` (per conventions/development/repo/structure/
# sdk-structure.md). So every `src/...` path here is code-dir-relative, not repo-root-relative.
#
# Version is the source of truth in src/Directory.Build.props — format 10.{y}.{z}-beta:
#   x = 10     → .NET line (fixed)
#   z          → bumps each release; rolls to 0 (and y += 1) when it passes 99
#   -beta      → prerelease label (the mono-lib pulls prerelease deps → NU5104 on a stable id)
#
# The bump commit carries [skip ci] so it never re-triggers this workflow (no publish loop).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write          # commit the version bump back to main
  id-token: write          # mint the OIDC token for NuGet Trusted Publishing

concurrency:
  group: publish
  cancel-in-progress: false  # never cancel a half-finished publish

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      revision: ${{ steps.bump.outputs.revision }}
    defaults:
      run:
        working-directory: engineering/codebase/wow-two-sdk-beta-be
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: engineering/codebase/wow-two-sdk-beta-be/global.json

      - name: Bump version (10.y.z-beta)
        id: bump
        run: |
          PROPS=src/Directory.Build.props
          CUR=$(grep -oP '(?<=<Version>)[^<]+' "$PROPS" | head -1)
          CORE=${CUR%-beta}
          IFS=. read -r _ Y Z <<< "$CORE"
          Z=$((10#$Z + 1))
          if [ "$Z" -ge 100 ]; then Z=0; Y=$((10#$Y + 1)); fi
          VERSION="10.$Y.$Z-beta"
          FILEVERSION="10.$Y.$Z"
          sed -i "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|" "$PROPS"
          sed -i "s|<FileVersion>[^<]*</FileVersion>|<FileVersion>$FILEVERSION</FileVersion>|" "$PROPS"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PROPS"
          git commit -m "chore: release $VERSION [skip ci]"
          git tag -a "v$VERSION" -m "Release $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing $VERSION (was $CUR)"

      - name: Restore
        run: dotnet restore src/WoW.Two.Sdk.Backend.Beta.slnx -m:1

      - name: Test publication verifier
        run: python3 scripts/test-verify-published-packages.py

      - name: Build release projects
        run: dotnet build src/WoW.Two.Sdk.Backend.Beta.slnx -c Release --no-restore -m:1

      - name: Test release revision
        run: dotnet test src/WoW.Two.Sdk.Backend.Beta.slnx -c Release --no-build --no-restore -m:1

      - name: Pack         # version from Directory.Build.props (just bumped). Pack the 7 published projects:
        run: |
          # mono-lib + Data.Abstractions (the mono-lib's nuspec dependency) + the wow-migrate CLI tool + the Testing helper lib + the Testing.Data data-tier helper lib + the Testing.Integrations integration-client doubles + the Testing.Messaging harness (all referenced by app test projects).
          dotnet pack src/WoW.Two.Sdk.Backend.Beta.csproj -c Release --no-build --no-restore -m:1 -p:ContinuousIntegrationBuild=true -p:RepositoryCommit=${{ steps.bump.outputs.revision }} -o artifacts
          dotnet pack src/Data/Abstractions/WoW.Two.Sdk.Backend.Beta.Data.Abstractions.csproj -c Release --no-build --no-restore -m:1 -p:ContinuousIntegrationBuild=true -p:RepositoryCommit=${{ steps.bump.outputs.revision }} -o artifacts
          dotnet pack src/Data/Migrations/cli/WoW.Two.Sdk.Backend.Beta.Data.Migrations.Cli.csproj -c Release --no-build --no-restore -m:1 -p:ContinuousIntegrationBuild=true -p:RepositoryCommit=${{ steps.bump.outputs.revision }} -o artifacts
          dotnet pack src/Testing/WoW.Two.Sdk.Backend.Beta.Testing.csproj -c Release --no-build --no-restore -m:1 -p:ContinuousIntegrationBuild=true -p:RepositoryCommit=${{ steps.bump.outputs.revision }} -o artifacts
          dotnet pack src/Testing.Data/WoW.Two.Sdk.Backend.Beta.Testing.Data.csproj -c Release --no-build --no-restore -m:1 -p:ContinuousIntegrationBuild=true -p:RepositoryCommit=${{ steps.bump.outputs.revision }} -o artifacts
          dotnet pack src/Testing.Integrations/WoW.Two.Sdk.Backend.Beta.Testing.Integrations.csproj -c Release --no-build --no-restore -m:1 -p:ContinuousIntegrationBuild=true -p:RepositoryCommit=${{ steps.bump.outputs.revision }} -o artifacts
          dotnet pack src/Testing.Messaging/WoW.Two.Sdk.Backend.Beta.Testing.Messaging.csproj -c Release --no-build --no-restore -m:1 -p:ContinuousIntegrationBuild=true -p:RepositoryCommit=${{ steps.bump.outputs.revision }} -o artifacts

      - name: Verify release packages
        run: bash scripts/verify-release-packages.sh artifacts "${{ steps.bump.outputs.version }}" "${{ steps.bump.outputs.revision }}"

      - name: Retain verified packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.bump.outputs.version }}
          path: engineering/codebase/wow-two-sdk-beta-be/artifacts
          if-no-files-found: error

      - name: Authenticate to NuGet (Trusted Publishing)   # OIDC → short-lived API key, no stored secret
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: MaxDev

      - name: Push to nuget.org   # the adjacent .snupkg is pushed automatically
        run: dotnet nuget push "artifacts/*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Push release commit and tag
        run: |
          git push --follow-tags

      - name: Verify published version and tag
        timeout-minutes: 17
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          REVISION: ${{ steps.bump.outputs.revision }}
        run: |
          PUBLISHED_REVISION=$(git ls-remote --exit-code --tags origin "refs/tags/v$VERSION^{}" | cut -f1)
          if [ "$PUBLISHED_REVISION" != "$REVISION" ]; then
            echo "::error::Release tag v$VERSION points to $PUBLISHED_REVISION; expected $REVISION"
            exit 1
          fi
          bash scripts/verify-published-packages.sh "$VERSION"
